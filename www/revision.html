<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 body{font-family:sans-serif;margin:0;background:#fff;color:#222}
 header{position:sticky;top:0;background:#c62828;color:#fff;padding:14px 16px;z-index:5}
 header h1{margin:0;font-size:20px}
 header div{font-size:14px;margin-top:2px}
 .item{padding:14px 16px;border-bottom:8px solid #f1f1f1}
 .item h3{margin:0 0 4px;font-size:16px;color:#b71c1c}
 .item p{margin:0 0 10px;font-size:15px;font-weight:bold}
 .item img.ref{display:block;width:100%;max-width:420px;height:auto;margin:0 auto 12px;border-radius:6px}
 .op{display:flex;gap:8px}
 .op label{flex:1}
 .op input{position:absolute;opacity:0;pointer-events:none}
 .op span{display:block;text-align:center;padding:12px 4px;border:2px solid #bbb;border-radius:8px;font-size:14px;font-weight:bold;color:#555;background:#fff}
 .op input:checked + span.c{background:#2e7d32;border-color:#2e7d32;color:#fff}
 .op input:checked + span.i{background:#c62828;border-color:#c62828;color:#fff}
 .op input:checked + span.s{background:#f9a825;border-color:#f9a825;color:#222}
 .foto{margin-top:12px}
 .foto img{display:block;width:100%;max-width:420px;margin:0 auto 8px;border-radius:6px;border:2px solid #c62828}
 .fb{display:flex;gap:8px;margin-bottom:10px}
 .fb button{flex:1;padding:12px 6px;font-size:15px;font-weight:bold;border:2px solid #c62828;background:#fff;color:#c62828;border-radius:8px}
 .pie{padding:16px;display:flex;flex-direction:column;gap:12px}
 .btn{display:block;text-align:center;padding:14px;border:2px solid #c62828;color:#c62828;background:#fff;border-radius:8px;text-decoration:none;font-size:17px;font-weight:bold}
 .btn.env{background:#c62828;color:#fff}
 #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:center;justify-content:center;padding:20px}
 #modal .caja{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:360px}
 #modal h2{margin:0 0 8px;font-size:20px;color:#b71c1c}
 #modal p{margin:0 0 16px;font-size:16px}
 #modal button{display:block;width:100%;padding:14px;font-size:17px;font-weight:bold;border-radius:8px;margin-top:10px;border:2px solid #c62828}
 #mLote{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;align-items:center;justify-content:center;padding:20px}
 #mLote .caja{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:360px}
 #mLote h2{margin:0 0 12px;font-size:20px;color:#b71c1c}
 #mLote input{width:100%;box-sizing:border-box;padding:14px;font-size:20px;border:2px solid #bbb;border-radius:8px}
 #mLote button,#mLote a{display:block;width:100%;box-sizing:border-box;padding:14px;font-size:17px;font-weight:bold;border-radius:8px;margin-top:12px;border:2px solid #c62828;text-align:center;text-decoration:none}
 #mLoteOk{background:#c62828;color:#fff}
 #mLoteVolver{background:#fff;color:#c62828}
 #loteTxt{font-size:14px;margin-top:2px;text-decoration:underline}
 #mCap{background:#c62828;color:#fff}
 #mNo{background:#fff;color:#c62828}
</style>
</head>
<body>
 <header><h1 id="titulo">Revisión</h1><div id="cont"></div><div id="loteTxt"></div></header>
 <div id="lista"></div>
 <div class="pie"><a class="btn env" id="enviar" href="#">Enviar informe</a><a class="btn" id="volver" href="index.html">← Volver</a></div>
 <input type="file" id="cam" accept="image/*" capture="environment" style="display:none">
 <div id="mLote"><div class="caja"><h2>Escribe N° OT</h2><input type="text" id="loteIn" inputmode="numeric" maxlength="9" placeholder="00/000000" autocomplete="off"><div id="loteErr" style="color:#c62828;font-size:14px;margin-top:6px;min-height:18px"></div>
  <button id="mLoteOk">Aceptar</button><a id="mLoteVolver" href="index.html">Volver</a></div></div>
 <div id="modal"><div class="caja"><h2>Capturar fotografía</h2><p id="mTxt"></p>
  <button id="mCap">Capturar fotografía</button><button id="mNo">Ahora no</button></div></div>
 <script>
 var id = new URLSearchParams(location.search).get("id");
 var KEY = "rev_" + id, KF = "revf_" + id, KL = "revl_" + id, estado = {}, fotos = {}, pend = null, lote = "";
 try { lote = localStorage.getItem(KL) || ""; } catch(e){}
 if (!/^\d{2}\/\d{6}$/.test(lote)) lote = "";
 try { estado = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){}
 try { fotos = JSON.parse(localStorage.getItem(KF) || "{}"); } catch(e){}
 function guardar(){ try { localStorage.setItem(KEY, JSON.stringify(estado)); } catch(x){} }
 function guardarFotos(){ try { localStorage.setItem(KF, JSON.stringify(fotos)); return true; } catch(x){ return false; } }
 function sid(n){ return "f" + n.replace(".", "_"); }
 function contar(){ document.getElementById("cont").textContent = Object.keys(estado).length + " de " + window.DATOS.items.length + " revisados"; }
 var MAXF = 10;
 function lista(n){ var f = fotos[n]; if (!f) return []; return typeof f === "string" ? [f] : f; }
 function pintaFoto(n){
   var box = document.getElementById(sid(n)), v = estado[n], h = "", fs = lista(n);
   if (v === "incorrecto" || v === "seguimiento") {
     fs.forEach(function(u, k){
       h += '<img src="' + u + '" alt="Foto"><div class="fb"><button data-a="quitar" data-n="' + n + '" data-i="' + k + '">Quitar foto ' + (k + 1) + '</button></div>';
     });
     if (fs.length < MAXF) h += '<div class="fb"><button data-a="foto" data-n="' + n + '">' + (fs.length ? "Añadir otra foto" : "Capturar fotografía") + '</button></div>';
   }
   box.innerHTML = h;
 }
 function abrirModal(n, v){
   pend = n;
   document.getElementById("mTxt").textContent = "Punto " + n + " marcado como " + (v === "incorrecto" ? "incorrecto" : "en seguimiento") + ". ¿Quieres adjuntar una foto?";
   document.getElementById("modal").style.display = "flex";
 }
 function cerrarModal(){ document.getElementById("modal").style.display = "none"; }
 function reducir(file, cb){
   var r = new FileReader();
   r.onload = function(){
     var im = new Image();
     im.onload = function(){
       var k = Math.min(1, 1280 / Math.max(im.width, im.height));
       var c = document.createElement("canvas");
       c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
       c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
       cb(c.toDataURL("image/jpeg", 0.7));
     };
     im.onerror = function(){ cb(null); };
     im.src = r.result;
   };
   r.onerror = function(){ cb(null); };
   r.readAsDataURL(file);
 }
 function reiniciar(){
   estado = {}; fotos = {};
   try { localStorage.removeItem(KEY); localStorage.removeItem(KF); } catch(x){}
   var rs = document.querySelectorAll("#lista input[type=radio]");
   for (var k = 0; k < rs.length; k++) rs[k].checked = false;
   window.DATOS.items.forEach(function(it){ pintaFoto(it.n); });
   lote = ""; try { localStorage.removeItem(KL); } catch(x){}
   pintaLote(); contar(); window.scrollTo(0, 0); pedirLote();
 }
 var _mc = null;
 function medir(t, size, bold){
   if (!_mc) _mc = document.createElement("canvas").getContext("2d");
   _mc.font = (bold ? "bold " : "") + size + "px Helvetica, Arial, sans-serif";
   return _mc.measureText(t).width * 1.05;
 }
 function limpia(t){ return String(t).replace(/[–—]/g, "-").replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/…/g, "..."); }
 function strBytes(s){ var b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++){ var c = s.charCodeAt(i); b[i] = c < 256 ? c : 63; } return b; }
 function pdfEsc(s){ return s.replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)"); }
 function dataToBytes(u){ var bin = atob(u.split(",")[1]), b = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; }
 function dimImg(u){ return new Promise(function(res){ var im = new Image(); im.onload = function(){ res({w: im.naturalWidth, h: im.naturalHeight}); }; im.onerror = function(){ res(null); }; im.src = u; }); }
 function partir(t, size, bold, max){
   var ws = t.split(" "), ls = [], cur = "";
   ws.forEach(function(w){
     var test = cur ? cur + " " + w : w;
     if (cur && medir(test, size, bold) > max) { ls.push(cur); cur = w; } else cur = test;
   });
   if (cur) ls.push(cur);
   return ls;
 }
 // puntos: [{cab:"11.5 TEXTO - INCORRECTO", fotos:[dataURL,...], color:"r g b"}]
 async function crearPDF(titulo, subtitulo, resumen, puntos){
   var PW = 595, PH = 842, M = 40, maxW = PW - 2 * M;
   var pages = [[]], y = PH - 50 - 24, imgs = [];
   function nueva(){ pages.push([]); y = PH - M; }
   function cur(){ return pages[pages.length - 1]; }
   function texto(t, size, bold, rgb){
     var lh = size * 1.3;
     partir(limpia(t), size, bold, maxW).forEach(function(l){
       if (y - lh < M) nueva();
       y -= lh;
       cur().push("BT /" + (bold ? "F2" : "F1") + " " + size + " Tf " + rgb + " rg " + M + " " + y.toFixed(1) + " Td (" + pdfEsc(l) + ") Tj ET");
     });
   }
   function espacio(h){ y -= h; }
   // cabecera roja en la primera página
   pages[0].push("0.776 0.157 0.157 rg 0 " + (PH - 50) + " " + PW + " 50 re f");
   pages[0].push("BT /F2 18 Tf 1 1 1 rg " + M + " " + (PH - 32) + " Td (" + pdfEsc(limpia(titulo)) + ") Tj ET");
   texto(subtitulo, 11, false, "0.2 0.2 0.2");
   espacio(8);
   texto("Resumen", 14, true, "0.72 0.11 0.11");
   resumen.forEach(function(r){ texto(r, 12, false, "0 0 0"); });
   espacio(12);
   texto("Puntos incorrectos o en seguimiento", 14, true, "0.72 0.11 0.11");
   espacio(4);
   if (!puntos.length) texto("Ninguno. Sin incidencias.", 12, false, "0 0 0");
   for (var k = 0; k < puntos.length; k++){
     var p = puntos[k];
     espacio(8);
     // evitar cabecera huérfana al final de página
     if (y < M + 120) nueva();
     texto(p.cab, 12, true, p.color);
     var fl = p.fotos || [];
     for (var q = 0; q < fl.length; q++){
       var dm = await dimImg(fl[q]);
       if (dm){
         var sc = Math.min(300 / dm.w, 260 / dm.h), dw = dm.w * sc, dh = dm.h * sc;
         if (y - dh - 6 < M) nueva();
         y -= dh + 6;
         imgs.push({bytes: dataToBytes(fl[q]), w: dm.w, h: dm.h});
         cur().push("q " + dw.toFixed(1) + " 0 0 " + dh.toFixed(1) + " " + M + " " + y.toFixed(1) + " cm /Im" + (imgs.length - 1) + " Do Q");
       }
     }
   }
   // ensamblar PDF
   var chunks = [], len = 0, offs = {};
   function put(b){ if (typeof b === "string") b = strBytes(b); chunks.push(b); len += b.length; }
   function obj(id, dict, stream){
     offs[id] = len;
     if (stream){ put(id + " 0 obj\n<< " + dict + " /Length " + stream.length + " >>\nstream\n"); put(stream); put("\nendstream\nendobj\n"); }
     else put(id + " 0 obj\n" + dict + "\nendobj\n");
   }
   var np = pages.length, base = 6, imgBase = base + 2 * np, total = imgBase + imgs.length;
   put("%PDF-1.4\n");
   obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
   var kids = []; for (var i = 0; i < np; i++) kids.push((base + 2 * i) + " 0 R");
   obj(2, "<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + np + " >>");
   obj(3, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
   obj(4, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
   var xo = ""; imgs.forEach(function(_, j){ xo += "/Im" + j + " " + (imgBase + j) + " 0 R "; });
   obj(5, "<< /Font << /F1 3 0 R /F2 4 0 R >> /XObject << " + xo + ">> >>");
   for (var i2 = 0; i2 < np; i2++){
     obj(base + 2 * i2, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW + " " + PH + "] /Resources 5 0 R /Contents " + (base + 2 * i2 + 1) + " 0 R >>");
     obj(base + 2 * i2 + 1, "", strBytes(pages[i2].join("\n")));
   }
   imgs.forEach(function(im, j){
     obj(imgBase + j, "/Type /XObject /Subtype /Image /Width " + im.w + " /Height " + im.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode", im.bytes);
   });
   var xref = len;
   put("xref\n0 " + total + "\n0000000000 65535 f \n");
   for (var id = 1; id < total; id++) put(("0000000000" + offs[id]).slice(-10) + " 00000 n \n");
   put("trailer\n<< /Size " + total + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF\n");
   var out = new Uint8Array(len), pos = 0;
   chunks.forEach(function(c){ out.set(c, pos); pos += c.length; });
   return out;
 }
 function bytesToB64(u8){ var s = "", n = 0x8000; for (var i = 0; i < u8.length; i += n) s += String.fromCharCode.apply(null, u8.subarray(i, i + n)); return btoa(s); }
 function pintaLote(){ document.getElementById("loteTxt").textContent = lote ? "N° OT: " + lote + " (cambiar)" : ""; }
 function pedirLote(){
   var inp = document.getElementById("loteIn");
   inp.value = lote;
   document.getElementById("mLoteVolver").href = "linea.html?id=" + id;
   document.getElementById("mLote").style.display = "flex";
   setTimeout(function(){ inp.focus(); }, 150);
 }
 document.getElementById("mLoteOk").addEventListener("click", function(){
   var v = document.getElementById("loteIn").value.trim();
   if (!/^\d{2}\/\d{6}$/.test(v)) { document.getElementById("loteErr").textContent = "Escribe el N° OT con el formato 00/000000"; return; }
   document.getElementById("loteErr").textContent = "";
   lote = v;
   try { localStorage.setItem(KL, lote); } catch(e){}
   document.getElementById("mLote").style.display = "none";
   pintaLote();
 });
 document.getElementById("loteIn").addEventListener("input", function(e){
   var d = e.target.value.replace(/\D/g, "").slice(0, 8);
   e.target.value = d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d;
   document.getElementById("loteErr").textContent = "";
 });
 document.getElementById("loteTxt").addEventListener("click", pedirLote);
 var s = document.createElement("script");
 s.src = id + ".js";
 s.onload = function(){
   var d = window.DATOS, h = "";
   document.getElementById("titulo").textContent = "Revisión " + id;
   document.getElementById("volver").href = "linea.html?id=" + id;
   d.items.forEach(function(it){
     var nm = "r" + it.n, v = estado[it.n];
     function op(val, cls, txt){
       return '<label><input type="radio" name="' + nm + '" value="' + val + '"' + (v===val?' checked':'') + '><span class="' + cls + '">' + txt + '</span></label>';
     }
     h += '<div class="item"><h3>' + it.n + '</h3><p>' + it.t + '</p><img class="ref" src="' + it.img + '" alt="">' +
          '<div class="op" data-n="' + it.n + '">' + op("correcto","c","Correcto") + op("incorrecto","i","Incorrecto") + op("seguimiento","s","En seguimiento") + '</div>' +
          '<div class="foto" id="' + sid(it.n) + '"></div></div>';
   });
   document.getElementById("lista").innerHTML = h;
   d.items.forEach(function(it){ pintaFoto(it.n); });
   contar(); pintaLote();
   if (!lote) pedirLote();

   document.getElementById("lista").addEventListener("change", function(e){
     if (e.target.type !== "radio") return;
     var n = e.target.closest(".op").getAttribute("data-n"), v = e.target.value;
     estado[n] = v; guardar();
     if (v === "correcto" && fotos[n]) { delete fotos[n]; guardarFotos(); }
     pintaFoto(n); contar();
     if ((v === "incorrecto" || v === "seguimiento") && !lista(n).length) abrirModal(n, v);
   });
   document.getElementById("lista").addEventListener("click", function(e){
     var a = e.target.getAttribute && e.target.getAttribute("data-a");
     if (!a) return;
     var n = e.target.getAttribute("data-n");
     if (a === "foto") { pend = n; document.getElementById("cam").click(); }
     if (a === "quitar") {
       var arr = lista(n).slice(); arr.splice(parseInt(e.target.getAttribute("data-i"), 10), 1);
       if (arr.length) fotos[n] = arr; else delete fotos[n];
       guardarFotos(); pintaFoto(n);
     }
   });
   document.getElementById("mCap").addEventListener("click", function(){
     document.getElementById("cam").click(); cerrarModal();
   });
   document.getElementById("mNo").addEventListener("click", cerrarModal);
   document.getElementById("cam").addEventListener("change", function(e){
     var f = e.target.files && e.target.files[0], n = pend;
     if (!f || !n) return;
     reducir(f, function(data){
       if (!data) { alert("No se pudo leer la foto."); return; }
       var arr = lista(n).slice(); arr.push(data); fotos[n] = arr;
       if (!guardarFotos()) {
         arr.pop(); if (arr.length) fotos[n] = arr; else delete fotos[n];
         alert("No hay espacio para guardar más fotos en la app.");
       }
       pintaFoto(n);
     });
     e.target.value = "";
   });

   document.getElementById("enviar").addEventListener("click", async function(ev){
     ev.preventDefault();
     if (!lote) { pedirLote(); return; }
     var tot = d.items.length, sin = tot - Object.keys(estado).length;
     var msg = sin > 0 ? "Quedan " + sin + " puntos sin revisar. ¿Generar el informe en PDF y reiniciar el checklist?" : "¿Generar el informe en PDF y reiniciar el checklist?";
     if (!confirm(msg)) return;
     var btn = document.getElementById("enviar");
     btn.textContent = "Generando PDF...";
     var c = 0, i = 0, sg = 0, puntos = [];
     d.items.forEach(function(it){
       var v = estado[it.n];
       if (v === "correcto") c++; else if (v === "incorrecto") i++; else if (v === "seguimiento") sg++;
       if (v === "incorrecto" || v === "seguimiento") {
         puntos.push({
           cab: it.n + " " + it.t + " - " + (v === "incorrecto" ? "INCORRECTO" : "EN SEGUIMIENTO"),
           fotos: lista(it.n),
           color: v === "incorrecto" ? "0.72 0.11 0.11" : "0.7 0.45 0"
         });
       }
     });
     var ahora = new Date();
     var p2 = function(x){ return ("0" + x).slice(-2); };
     var sello = ahora.getFullYear() + "-" + p2(ahora.getMonth() + 1) + "-" + p2(ahora.getDate()) + "_" + p2(ahora.getHours()) + p2(ahora.getMinutes());
     var nombre = "Revision_" + id + "_" + sello + ".pdf";
     var asunto = "Revisión de astillables - " + id;
     var P = (window.Capacitor && window.Capacitor.Plugins) || {};
     try {
       var bytes = await crearPDF("Revisión de astillables - Línea " + id, "N° OT: " + lote + "   -   Fecha: " + ahora.toLocaleString("es-ES"),
         ["Correctos: " + c, "Incorrectos: " + i, "En seguimiento: " + sg, "Sin revisar: " + sin], puntos);
       if (P.Share && P.Filesystem) {
         var r = await P.Filesystem.writeFile({ path: nombre, data: bytesToB64(bytes), directory: "CACHE" });
         await P.Share.share({ title: asunto, text: asunto, files: [r.uri], dialogTitle: "Enviar informe" });
       } else {
         var a = document.createElement("a");
         a.href = URL.createObjectURL(new Blob([bytes], {type: "application/pdf"}));
         a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
       }
       reiniciar();
     } catch (err) {
       var m = String((err && err.message) || err);
       if (!/cancel/i.test(m)) alert("No se pudo generar o enviar el informe: " + m);
     }
     btn.textContent = "Enviar informe";
   });
 };
 s.onerror = function(){ document.getElementById("lista").innerHTML = '<p style="padding:16px">Checklist no disponible.</p>'; };
 document.body.appendChild(s);
 </script>
</body>
</html>
